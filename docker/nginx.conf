# Static server for the production bundle (dist/), used by ../Dockerfile.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # JS/CSS/JSON/wasm shrink a lot; the terrain and cloud .bin data (octet-stream) by ~25 %.
    # JPG and MP3 are already compressed and are left alone.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;

    # Vite content-hashes everything under /assets/, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy picks up the new hashed bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Textures, env data, models and audio keep their names across builds: cache briefly, revalidate by ETag.
    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }
}
